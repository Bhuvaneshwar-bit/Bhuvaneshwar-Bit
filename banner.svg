<svg width="900" height="140" viewBox="0 0 900 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%">
        <animate attributeName="stop-color" values="#0f0c29;#667eea;#f093fb;#302b63;#0f0c29" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%">
        <animate attributeName="stop-color" values="#302b63;#f093fb;#4facfe;#667eea;#302b63" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%">
        <animate attributeName="stop-color" values="#24243e;#4facfe;#667eea;#f093fb;#24243e" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="140" fill="url(#grad)"/>

  <!-- Floating particles -->
  <circle cx="60" cy="35" r="2.5" fill="rgba(255,255,255,0.5)">
    <animate attributeName="cy" values="35;20;35" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="110" r="1.8" fill="rgba(255,255,255,0.35)">
    <animate attributeName="cy" values="110;95;110" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.75;0.35" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="25" r="1.5" fill="rgba(255,255,255,0.4)">
    <animate attributeName="cy" values="25;15;25" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="580" cy="115" r="2" fill="rgba(255,255,255,0.3)">
    <animate attributeName="cy" values="115;100;115" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="30" r="2.2" fill="rgba(255,255,255,0.45)">
    <animate attributeName="cy" values="30;18;30" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0.9;0.45" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="840" cy="95" r="1.6" fill="rgba(255,255,255,0.35)">
    <animate attributeName="cy" values="95;82;95" dur="5.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.7;0.35" dur="5.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="20" r="1.4" fill="rgba(255,255,255,0.3)">
    <animate attributeName="cy" values="20;10;20" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Main title -->
  <text x="450" y="62" text-anchor="middle"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="30" font-weight="700" fill="white" filter="url(#glow)">
    Welcome to my GitHub!
    <animate attributeName="opacity" values="0;0;1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- Subtitle -->
  <text x="450" y="96" text-anchor="middle"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="14" fill="rgba(255,255,255,0.88)" letter-spacing="0.5">
    Full-Stack Dev  |  MERN + AWS  |  Let's build together
    <animate attributeName="opacity" values="0;0;0;1" dur="1.8s" fill="freeze"/>
  </text>

  <!-- Bottom wave -->
  <path d="M0 122 Q150 108 300 122 Q450 136 600 122 Q750 108 900 122 L900 140 L0 140 Z"
    fill="rgba(0,0,0,0.18)"/>
</svg>
