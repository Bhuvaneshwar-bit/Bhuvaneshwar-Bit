<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#050010"/>
      <stop offset="55%" stop-color="#1a0535"/>
      <stop offset="82%" stop-color="#4a0660"/>
      <stop offset="100%" stop-color="#8c006e"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ff9d00"/>
      <stop offset="50%" stop-color="#ff5580"/>
      <stop offset="100%" stop-color="#ff00cc"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ff5580" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff5580" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sunClip"><circle cx="450" cy="90" r="38"/></clipPath>
    <clipPath id="floor"><rect x="0" y="90" width="900" height="70"/></clipPath>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="floorFade">
      <linearGradient id="fm" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="black"/>
        <stop offset="35%" stop-color="white"/>
        <stop offset="100%" stop-color="white"/>
      </linearGradient>
      <rect x="0" y="90" width="900" height="70" fill="url(#fm)"/>
    </mask>
  </defs>

  <!-- Sky -->
  <rect width="900" height="160" fill="url(#sky)"/>

  <!-- Stars -->
  <circle cx="80"  cy="12" r="1"   fill="white"><animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="190" cy="28" r="0.8" fill="white"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.3s" repeatCount="indefinite"/></circle>
  <circle cx="310" cy="18" r="1.1" fill="white"><animate attributeName="opacity" values="1;0.3;1" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="420" cy="8"  r="0.7" fill="white"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="4.1s" repeatCount="indefinite"/></circle>
  <circle cx="560" cy="22" r="1"   fill="white"><animate attributeName="opacity" values="1;0.2;1" dur="1.9s" repeatCount="indefinite"/></circle>
  <circle cx="660" cy="10" r="0.9" fill="white"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.7s" repeatCount="indefinite"/></circle>
  <circle cx="780" cy="30" r="1.2" fill="white"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="855" cy="15" r="0.8" fill="white"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.0s" repeatCount="indefinite"/></circle>
  <circle cx="130" cy="55" r="0.7" fill="white"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="4.5s" repeatCount="indefinite"/></circle>
  <circle cx="720" cy="48" r="0.8" fill="white"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.8s" repeatCount="indefinite"/></circle>

  <!-- Sun outer glow -->
  <ellipse cx="450" cy="90" rx="90" ry="50" fill="url(#sunGlow)">
    <animate attributeName="rx" values="90;100;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Sun body -->
  <circle cx="450" cy="90" r="38" fill="url(#sun)" filter="url(#glow2)"/>

  <!-- Sun stripes -->
  <g clip-path="url(#sunClip)" fill="#050010">
    <rect x="412" y="96"  width="76" height="5"/>
    <rect x="412" y="105" width="76" height="6"/>
    <rect x="412" y="115" width="76" height="7"/>
    <rect x="412" y="126" width="76" height="9"/>
  </g>

  <!-- Horizon line -->
  <line x1="0" y1="90" x2="900" y2="90" stroke="#ff5580" stroke-width="1.5" opacity="0.9" filter="url(#glow2)"/>

  <!-- Grid floor: vertical perspective lines -->
  <g clip-path="url(#floor)" mask="url(#floorFade)" stroke="#ff00cc" stroke-width="0.8" opacity="0.75">
    <line x1="450" y1="90" x2="450" y2="160"/>
    <line x1="450" y1="90" x2="360" y2="160"/>
    <line x1="450" y1="90" x2="270" y2="160"/>
    <line x1="450" y1="90" x2="180" y2="160"/>
    <line x1="450" y1="90" x2="90"  y2="160"/>
    <line x1="450" y1="90" x2="0"   y2="160"/>
    <line x1="450" y1="90" x2="540" y2="160"/>
    <line x1="450" y1="90" x2="630" y2="160"/>
    <line x1="450" y1="90" x2="720" y2="160"/>
    <line x1="450" y1="90" x2="810" y2="160"/>
    <line x1="450" y1="90" x2="900" y2="160"/>
  </g>

  <!-- Grid floor: animated horizontal lines scrolling toward viewer -->
  <g clip-path="url(#floor)" mask="url(#floorFade)" stroke="#00ffff" opacity="0.8">
    <!-- Line A -->
    <line x1="450" y1="90" x2="450" y2="90" stroke-width="0.4">
      <animate attributeName="y1" values="90;160" dur="2.4s" repeatCount="indefinite" begin="0s" calcMode="linear"/>
      <animate attributeName="y2" values="90;160" dur="2.4s" repeatCount="indefinite" begin="0s" calcMode="linear"/>
      <animate attributeName="x1" values="450;0"   dur="2.4s" repeatCount="indefinite" begin="0s" calcMode="linear"/>
      <animate attributeName="x2" values="450;900" dur="2.4s" repeatCount="indefinite" begin="0s" calcMode="linear"/>
      <animate attributeName="stroke-width" values="0.2;1.8" dur="2.4s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="2.4s" repeatCount="indefinite" begin="0s"/>
    </line>
    <!-- Line B -->
    <line x1="450" y1="90" x2="450" y2="90" stroke-width="0.4">
      <animate attributeName="y1" values="90;160" dur="2.4s" repeatCount="indefinite" begin="-0.4s" calcMode="linear"/>
      <animate attributeName="y2" values="90;160" dur="2.4s" repeatCount="indefinite" begin="-0.4s" calcMode="linear"/>
      <animate attributeName="x1" values="450;0"   dur="2.4s" repeatCount="indefinite" begin="-0.4s" calcMode="linear"/>
      <animate attributeName="x2" values="450;900" dur="2.4s" repeatCount="indefinite" begin="-0.4s" calcMode="linear"/>
      <animate attributeName="stroke-width" values="0.2;1.8" dur="2.4s" repeatCount="indefinite" begin="-0.4s"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="2.4s" repeatCount="indefinite" begin="-0.4s"/>
    </line>
    <!-- Line C -->
    <line x1="450" y1="90" x2="450" y2="90" stroke-width="0.4">
      <animate attributeName="y1" values="90;160" dur="2.4s" repeatCount="indefinite" begin="-0.8s" calcMode="linear"/>
      <animate attributeName="y2" values="90;160" dur="2.4s" repeatCount="indefinite" begin="-0.8s" calcMode="linear"/>
      <animate attributeName="x1" values="450;0"   dur="2.4s" repeatCount="indefinite" begin="-0.8s" calcMode="linear"/>
      <animate attributeName="x2" values="450;900" dur="2.4s" repeatCount="indefinite" begin="-0.8s" calcMode="linear"/>
      <animate attributeName="stroke-width" values="0.2;1.8" dur="2.4s" repeatCount="indefinite" begin="-0.8s"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="2.4s" repeatCount="indefinite" begin="-0.8s"/>
    </line>
    <!-- Line D -->
    <line x1="450" y1="90" x2="450" y2="90" stroke-width="0.4">
      <animate attributeName="y1" values="90;160" dur="2.4s" repeatCount="indefinite" begin="-1.2s" calcMode="linear"/>
      <animate attributeName="y2" values="90;160" dur="2.4s" repeatCount="indefinite" begin="-1.2s" calcMode="linear"/>
      <animate attributeName="x1" values="450;0"   dur="2.4s" repeatCount="indefinite" begin="-1.2s" calcMode="linear"/>
      <animate attributeName="x2" values="450;900" dur="2.4s" repeatCount="indefinite" begin="-1.2s" calcMode="linear"/>
      <animate attributeName="stroke-width" values="0.2;1.8" dur="2.4s" repeatCount="indefinite" begin="-1.2s"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="2.4s" repeatCount="indefinite" begin="-1.2s"/>
    </line>
    <!-- Line E -->
    <line x1="450" y1="90" x2="450" y2="90" stroke-width="0.4">
      <animate attributeName="y1" values="90;160" dur="2.4s" repeatCount="indefinite" begin="-1.6s" calcMode="linear"/>
      <animate attributeName="y2" values="90;160" dur="2.4s" repeatCount="indefinite" begin="-1.6s" calcMode="linear"/>
      <animate attributeName="x1" values="450;0"   dur="2.4s" repeatCount="indefinite" begin="-1.6s" calcMode="linear"/>
      <animate attributeName="x2" values="450;900" dur="2.4s" repeatCount="indefinite" begin="-1.6s" calcMode="linear"/>
      <animate attributeName="stroke-width" values="0.2;1.8" dur="2.4s" repeatCount="indefinite" begin="-1.6s"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="2.4s" repeatCount="indefinite" begin="-1.6s"/>
    </line>
    <!-- Line F -->
    <line x1="450" y1="90" x2="450" y2="90" stroke-width="0.4">
      <animate attributeName="y1" values="90;160" dur="2.4s" repeatCount="indefinite" begin="-2.0s" calcMode="linear"/>
      <animate attributeName="y2" values="90;160" dur="2.4s" repeatCount="indefinite" begin="-2.0s" calcMode="linear"/>
      <animate attributeName="x1" values="450;0"   dur="2.4s" repeatCount="indefinite" begin="-2.0s" calcMode="linear"/>
      <animate attributeName="x2" values="450;900" dur="2.4s" repeatCount="indefinite" begin="-2.0s" calcMode="linear"/>
      <animate attributeName="stroke-width" values="0.2;1.8" dur="2.4s" repeatCount="indefinite" begin="-2.0s"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="2.4s" repeatCount="indefinite" begin="-2.0s"/>
    </line>
  </g>

  <!-- Main neon text -->
  <text x="450" y="50" text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="26" font-weight="900" letter-spacing="3"
    fill="#00ffff" filter="url(#neon)">
    WELCOME TO MY GITHUB
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>

  <!-- Subtitle -->
  <text x="450" y="72" text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="11" letter-spacing="2.5"
    fill="#ff5580" filter="url(#glow2)">
    FULL-STACK DEV  ·  MERN + AWS  ·  LET'S BUILD
    <animate attributeName="opacity" values="0;1" dur="1.5s" begin="0.5s" fill="freeze"/>
  </text>
</svg>
